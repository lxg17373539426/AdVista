<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdVista</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <style>
    html,body{min-height:100%;margin:0}.boot-fallback{padding:24px}.app{min-height:100vh}
    .plus-wrap{position:relative}.attach-button{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid #d9dadd;border-radius:9px;background:#fff;color:#313238;font-size:20px;line-height:1;cursor:pointer}.attach-button:hover,.attach-button[aria-expanded="true"]{background:#eceeed}.composer-menu{position:absolute;z-index:40;left:0;bottom:42px;width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 120px);overflow-y:auto;padding:8px;border:1px solid #d8d9dc;border-radius:14px;background:#fff;box-shadow:0 18px 44px rgba(25,28,27,.16)}.menu-upload,.deliverable-option{display:flex;align-items:center;gap:11px;padding:10px;border-radius:9px;cursor:pointer}.menu-upload:hover,.deliverable-option:hover{background:#f3f4f3}.menu-upload input{position:absolute;opacity:0;pointer-events:none}.menu-upload::before{content:"↥";display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#e9eeeb;color:#244b3e;font-weight:700}.menu-upload span,.deliverable-option span{display:grid;min-width:0}.menu-upload small,.deliverable-option small,.deliverable-heading small{color:#777d79;font-size:11px}.menu-divider{height:1px;margin:5px 3px;background:#e6e7e5}.deliverable-heading{display:grid;padding:7px 10px 5px}.deliverable-heading strong{font-size:12px}.deliverable-option input{appearance:none;width:17px;height:17px;margin:0;border:1px solid #aeb3b0;border-radius:5px}.deliverable-option input:checked{border-color:#234f40;background:#234f40;box-shadow:inset 0 0 0 3px #fff}.deliverable-summary{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border-radius:999px;background:#e8efe9;color:#244b3e;font-size:11px;font-weight:650}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span>A</span><strong>AdVista</strong></div>
      <button id="new-chat" class="new-chat">＋ 新对话</button>
      <div class="history-title"><span>视频任务</span><span id="run-count">0</span></div>
      <div id="runs" class="run-list"></div>
      <div class="connection"><i></i><span id="health">连接中</span></div>
    </aside>

    <main class="main">
      <header class="header">
        <button id="menu" class="icon-button menu-button" type="button" aria-label="打开任务导航">☰</button>
        <div><strong id="header-title">AdVista</strong><small id="header-subtitle">通用助手与广告视频分析</small></div>
        <div class="header-actions"><button id="refresh" class="icon-button" title="刷新">↻</button></div>
      </header>

       <section id="conversation" class="conversation">
         <div id="context-bar" class="context-bar hidden"></div>
         <div id="context-bar" class="context-bar hidden"></div>
         <div id="welcome" class="welcome">
          <div class="welcome-mark">✦</div>
          <h1>有什么可以帮你？</h1>
          <p>可以直接聊天，也可以附加广告视频，让我分析画面、语音、字幕、卖点和创意。</p>
        </div>
        <div id="messages" class="messages"></div>
         <div id="job" class="job hidden" role="status" aria-live="polite"></div>
         <div id="run-status" class="run-status hidden" role="status"></div>
        <div id="boot-error" class="error-text hidden" role="alert"></div>
      </section>

      <div class="composer-wrap">
        <form id="prompt-form" class="composer">
          <div id="attachment" class="attachment hidden"><span id="attachment-name"></span><button type="button" id="remove-attachment">×</button></div>
          <textarea id="prompt" name="prompt" rows="1" placeholder="给 AdVista 发消息"></textarea>
          <div class="composer-tools">
            <div class="plus-wrap">
              <button id="composer-plus" class="attach-button" type="button" title="添加视频或选择交付物" aria-expanded="false" aria-controls="composer-menu">＋</button>
              <div id="composer-menu" class="composer-menu hidden">
                 <label class="menu-upload"><input id="video" name="video" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm,video/x-msvideo,video/x-m4v"><span><strong>附加广告视频</strong><small>MP4、MOV、MKV、WebM、AVI 或 M4V · 最大 1 GB / 10 分钟 / 4K</small></span></label>
                <div class="menu-divider"></div>
                <div class="deliverable-heading"><strong>选择一种任务</strong><small>每项任务只负责一个清晰目标</small></div>
                <label class="deliverable-option"><input type="radio" name="deliverable" value="evidence"><span><strong>证据提取</strong><small>只提取字幕、语音和 OCR</small></span></label>
                <label class="deliverable-option"><input type="radio" name="deliverable" value="report"><span><strong>卖点分析报告</strong><small>核心卖点及必要的营销分析</small></span></label>
                <label class="deliverable-option"><input type="radio" name="deliverable" value="risk_audit"><span><strong>风险复核</strong><small>只检查高风险和功效声明</small></span></label>
                <label class="deliverable-option"><input type="radio" name="deliverable" value="creative"><span><strong>创意建议</strong><small>基于证据生成 Hook、脚本和分镜</small></span></label>
              </div>
            </div>
            <span class="composer-hint" id="mode-hint">普通对话</span><span id="deliverable-summary" class="deliverable-summary hidden"></span>
            <button id="send" class="send-button" type="submit" title="发送">↑</button>
          </div>
        </form>
        <p class="disclaimer">AdVista 可能会出错。重要结论请检查对应证据。</p>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>

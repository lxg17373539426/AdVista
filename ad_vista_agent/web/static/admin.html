<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AdVista 诊断台</title>
  <style>
    :root{--rail:#183b35;--paper:#f4f0e8;--ink:#202522;--muted:#6f766e;--accent:#d26d43;--line:#d9d2c5;}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
    .shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.rail{background:var(--rail);color:#edf3eb;padding:28px 22px}.brand{font-size:20px;font-weight:700;letter-spacing:.02em}.eyebrow{margin:42px 0 8px;color:#a8c1b4;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.rail p{color:#c9d8cf;margin:0}.main{max-width:1200px;width:100%;padding:34px clamp(20px,4vw,64px)}h1{margin:0 0 8px;font-size:30px;letter-spacing:-.03em}.subtitle{color:var(--muted);margin:0 0 28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}input,select,button{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);font:inherit}input{min-width:280px}button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.card{padding:16px}.label{color:var(--muted);font-size:12px}.value{font-size:24px;font-weight:700;margin-top:5px}.panel{overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);font-weight:700}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 17px;border-bottom:1px solid #eee8dc;white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:600}td code{font-size:12px;color:#38574d}.status{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf1eb}.status.failed{background:#f8e4dc;color:#9c3c20}.status.completed{background:#e2f0e4;color:#28613b}.error{color:#a74122;margin:12px 0}.empty{padding:28px;color:var(--muted)}@media(max-width:720px){.shell{display:block}.rail{padding:18px 20px}.eyebrow{margin-top:18px}.main{padding:24px 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}input{min-width:0;width:100%}}
  </style>
</head>
<body>
  <div class="shell"><aside class="rail"><div class="brand">AdVista</div><div class="eyebrow">Operations</div><p>执行诊断台</p><div class="eyebrow">Purpose</div><p>定位模型、工具和上下文问题。</p></aside>
    <main class="main"><h1>执行诊断</h1><p class="subtitle">只展示可用于排障的元数据，不展示原始视频和完整 Prompt。</p>
      <div class="toolbar"><input id="key" type="password" placeholder="管理员 API Key"><select id="status"><option value="">全部状态</option><option value="failed">失败</option><option value="completed">完成</option><option value="running">运行中</option></select><button id="refresh">刷新</button></div>
      <div id="error" class="error"></div><section class="cards" id="cards"></section><section class="panel"><div class="panel-head">最近执行</div><div class="table-wrap"><table><thead><tr><th>Execution</th><th>状态</th><th>阶段</th><th>模型</th><th>错误</th><th>开始时间</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>暂无执行记录</div></section>
    </main>
  </div>
  <script>
    const key=document.querySelector('#key'), status=document.querySelector('#status'), error=document.querySelector('#error');
    key.value=sessionStorage.getItem('advista_admin_key')||'';
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){sessionStorage.setItem('advista_admin_key',key.value);error.textContent='';const headers={'X-API-Key':key.value};try{const query=status.value?`?status=${encodeURIComponent(status.value)}`:'';const [statsRes,execRes]=await Promise.all([fetch('/api/admin/stats',{headers}),fetch('/api/admin/executions'+query,{headers})]);if(!statsRes.ok||!execRes.ok)throw new Error('管理员认证失败或诊断服务不可用');const stats=await statsRes.json(), data=await execRes.json();const by=stats.executions_by_status||{};document.querySelector('#cards').innerHTML=Object.entries({完成:by.completed||0,失败:by.failed||0,运行中:by.running||0,工具调用:(stats.tool_calls||[]).reduce((n,x)=>n+Number(x.count||0),0)}).map(([k,v])=>`<div class="card"><div class="label">${k}</div><div class="value">${esc(v)}</div></div>`).join('');const rows=document.querySelector('#rows');rows.innerHTML=(data.executions||[]).map(x=>`<tr><td><code>${esc(x.execution_id)}</code></td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.current_stage||'-')}</td><td>${esc(x.model_version||'-')}</td><td>${esc(x.error_code||'-')}</td><td>${esc(x.started_at||'-')}</td></tr>`).join('');document.querySelector('#empty').hidden=Boolean((data.executions||[]).length)}catch(e){error.textContent=e.message;document.querySelector('#rows').innerHTML='';document.querySelector('#empty').hidden=false}}
  </script>
</body>
</html>

project:
  name: advista-insight-agent
  schema_version: "0.1"
paths:
  model_root: /opt/advista-agent/models
  video_data: /opt/advista-agent/data/videos
  output_root: /opt/advista-agent/outputs
hardware:
  cuda_visible_devices: "0"
  max_gpus: 1
models:
  qwen: Qwen3.5-9B-GSPO-Step300-Merged
  asr: faster-whisper-large-v3-turbo-ct2
  ocr: DeepSeek-OCR
tools:
  ffmpeg_executable: ffmpeg
  ffprobe_executable: ffprobe
timeline:
  detector: pyscenedetect_content
  scene_threshold: 27.0
  min_shot_ms: 500
  frame_format: jpg
  jpeg_quality: 2
asr:
  python_executable: /opt/advista-agent/.venv-asr/bin/python
  model: faster-whisper-large-v3-turbo-ct2
ocr:
  deepseek_python: /opt/advista-agent/.venv-ocr/bin/python
  model: DeepSeek-OCR
  prompt: "<image>\n<|grounding|>Convert the image to markdown."
ledger:
  ocr_similarity_threshold: 0.92
  ocr_max_gap_ms: 2500
  ocr_min_region_iou: 0.5
  cross_modal_similarity_threshold: 0.8
  cross_modal_window_ms: 1500
  conflict_context_similarity_threshold: 0.8
insight:
  python_executable: /opt/advista-agent/.venv-vllm/bin/python
  model: Qwen3.5-9B-GSPO-Step300-Merged
  runtime: openai
  endpoint: http://127.0.0.1:8000/v1
  served_model: AdInsight-RL
report:
  max_evidence_per_insight: 4
  embed_images: true
web:
  host: 127.0.0.1
  port: 8080
  api_token: replace-with-a-long-admin-token
  max_upload_bytes: 1073741824
  analysis_workers: 1
  max_active_jobs: 4
  max_active_jobs_per_user: 2
  api_requests_per_minute: 120
agent:
  backend: langgraph
  recursion_limit: 32
  tool_choice: required
